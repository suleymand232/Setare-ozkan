<!DOCTYPE html>
<html>
<head>
    <title>Mumcular Sitare Özkan Çok Programlı Anadolu Lisesi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">

    <style>
        :root {
            --bg-color: #dedede;
            --box-bg: dimgray;
            --text-color: #3f3f3f;
            --heading-color: #dedede;
            --link-color: #dedede;
        }

        body.dark-mode {
            --bg-color: #121212;
            --box-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --heading-color: #dedede;
            --link-color: #dedede;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            -webkit-text-fill-color: var(--text-color);
            margin: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .kutu {
            width: 90%;
            max-width: 1000px;
            margin: 20px auto;
            background-color: var(--box-bg);
            padding: 20px;
            border-radius: 30px;
            box-sizing: border-box;
            transition: background-color 0.3s ease;
        }

        h1 {
            margin-right: 1000px;
            color: var(--heading-color);
            -webkit-text-fill-color: var(--heading-color);
        }

        h5, p, span, li {
            color: var(--text-color);
            -webkit-text-fill-color: var(--text-color);
        }

        a {
            color: var(--link-color);
            -webkit-text-fill-color: var(--link-color);
            text-decoration: none;
            display: block;
            font-size: 16px;
            padding: 10px 0;
        }

        .kurallar {
            font-size: 30px;
        }

        .imza {
            text-align: center;
            font-size: 14px;
            color: #ccc;          
            margin-top: 30px;     
            font-style: italic;   
        }
                 
        img {
            width: 150px !important;    
            max-width: 100% !important;
            height: auto !important;
            display: block !important;
            margin: 15px auto !important;
            border-radius: 20px;
        }

        #darkModeToggle {
            position: fixed;
            top: 15px;
            right: 15px;
            background-color: var(--box-bg);
            color: var(--heading-color);
            -webkit-text-fill-color: var(--heading-color);
            border: 2px solid var(--heading-color);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            z-index: 9999;
        }
        a {
    transition: transform 0.2s ease, opacity 0.2s ease;
}

a:hover {
    transform: translateX(6px); 
    opacity: 0.9;
}
.badge {
    background-color: #ff4757;
    color: white !important;
    -webkit-text-fill-color: white !important;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 8px;
    font-weight: bold;
    vertical-align: middle;
}

    </style>
</head>
<body>
    <button id="darkModeToggle" onclick="geceModunuAcKapat()">🌙 Mod</button>

    <p class="imza">Made by Süleyman</p>
    <img src="ataturk.png" alt="AtaturkResmi">
    <div class="kutu">
        <h5>Mumcular Sitare Özkan eb Sayfasına Hoşgeldiniz.</h5>
        <h1>HABERLER</h1>
        <hr>
        <hr>
        <a href="ders-saatleri.html" target=_blank>›Okulumuzun Ders Başlama ve Bitiş Saatleri Belirlendi</a>
        <hr>
        <a href="ogretmenler-kurulu.html" target=_blank>› Sene Başı Öğretmenler Kurulu Toplantısı</a>
        <hr>
        <hr>
        <h1>DUYURULAR</h1>
        <hr>
        <hr>
        <a href="okul-kuralları.html" target=_blank>›Okul Kurallarımız</a>
        <hr>
        <a href="okul-kıyafeti.html"target="_blank">›Okul Kıyafetimiz <span class="badge">YENİ</span></a>
    </div>

    <script>
        function geceModunuAcKapat() {
            document.body.classList.toggle('dark-mode');
            const btn = document.getElementById('darkModeToggle');
            
            if (document.body.classList.contains('dark-mode')) {
                btn.innerHTML = "☀️ Mod";
                localStorage.setItem('theme', 'dark');
            } else {
                btn.innerHTML = "🌙 Mod";
                localStorage.setItem('theme', 'light');
            }
        }

        window.onload = function() {
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                const btn = document.getElementById('darkModeToggle');
                if (btn) btn.innerHTML = "☀️ Mod";
            }
        }
    </script>
</body>
</html>
